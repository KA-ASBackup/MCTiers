<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ㅤ</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jersey+15&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://www.khanacademy.org/computer-programming/assets-wip/6435356132360192/4945022646861824.png">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        ::-webkit-scrollbar { height:6px; width:6px; }
        ::-webkit-scrollbar-track { background:#0a0a0a; }
        ::-webkit-scrollbar-thumb { background:#2a2a2a; border-radius:3px; }
        ::-webkit-scrollbar-thumb:hover { background:#3a3a3a; }
        ::-webkit-scrollbar-corner { background:#0a0a0a; }

        body {
            background:#0d0d0d;
            color:#fff;
            font-family:'Jersey 15', 'Segoe UI', sans-serif;
            height:100vh;
            display:flex;
            flex-direction:column;
            overflow:hidden;
        }
        body * {
            color:#fff;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

        /* ── TAB BAR ── */
        .tabs {
            background:#222222;
            border-bottom: 2px solid #2a2a2a;
            padding:0 40px;
            display:flex;
            gap:4px;
            flex-shrink:0;
            align-items:flex-end;
            position:relative;
            z-index:50;
        }

        .tab {
            padding:10px 14px;
            font-size:15px;
            color:#fff;
            cursor:pointer;
            white-space:nowrap;
            transition:all 0.15s;
            display:flex;
            align-items:center;
            gap:7px;
            user-select:none;
            position:relative;
            border:1.5px solid transparent;
            border-bottom:none;
            border-radius: 8px 8px 0 0;
            margin-bottom:-1px;
        }
        .tab:hover { filter:brightness(1.3); }
        .tab.active {
            border-color:#7c3aed;
            border-bottom:none;
            background:transparent;
        }

        /* Tab with sub-modes gets extra right padding for arrow */
.tab.has-sub {
    padding-right: 14px;
}

.tab.has-sub.active {
    padding-right: 30px;
}

.tab .tab-arrow {
    display: none;
}

.tab.active.has-sub .tab-arrow {
    display: inline;
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px !important;
    text-shadow: none !important;
    color: #fff !important;
    pointer-events: auto;
    line-height: 1;
}

        .tab-icon {
            width:15px; height:15px;
            display:flex; align-items:center; justify-content:center;
            font-size:13px; line-height:1; flex-shrink:0;
        }
        .tab-icon img { width:15px; height:15px; object-fit:contain; }

        /* Sub-mode dropdown menu */
.tab-submenu {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 50%;
    transform: translateX(-50%);
    background: #141414;
    border: 2px solid #2a2a2a;
    border-radius: 10px;
    padding: 5px;
    z-index: 200;
    flex-direction: column;
    gap: 4px;
    white-space: nowrap;
    width: max-content;
}

.tab-submenu.open { display: flex; }

.tab-subitem {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 8px;
    border: 1.5px solid #7c3aed;
    background: transparent;
    cursor: pointer;
    font-size: 13px;
    font-family: 'Jersey 15', 'Segoe UI', sans-serif;
    white-space: nowrap;
    transition: filter 0.15s;
}

.tab-subitem:hover { filter: brightness(1.3); }
.tab-subitem img { width: 14px; height: 14px; object-fit: contain; }

        /* ── UTILITY BUTTONS (right side of tab bar) ── */
        .tabbar-btn {
            padding:8px 12px;
            background:none;
            border:none;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            border-radius:6px;
            flex-shrink:0;
            transition:filter 0.15s;
            z-index:10;
        }
        .tabbar-btn:hover { filter:brightness(1.4); }
        .panorama-btn { margin-left:auto; }

        /* ── INFO POPUP ── */
        #scene-info {
            display:none; position:fixed; inset:0;
            background:rgba(0,0,0,0.85); z-index:200;
            align-items:center; justify-content:center;
        }
        #scene-info.open { display:flex; }
#scene-settings {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,0.85); z-index:200;
    align-items:center; justify-content:center;
}
#scene-settings.open { display:flex; }
        .info-box {
            background:#141414; border:1px solid #2a2a2a;
            border-radius:14px; padding:28px 32px 24px;
            display:flex; flex-direction:column;
            align-items:center; gap:10px;
            position:relative; min-width:300px; max-width:380px;
            text-align:center;
        }
        .info-logo {
            width:48px; height:48px; object-fit:contain;
            margin-bottom:4px;
        }
        .info-email {
            font-size:13px; color:#fff; opacity:0.85;
        }
        .info-body {
            font-size:12px; color:#aaa;
            line-height:1.7; opacity:0.8;
        }
        .info-close {
            position:absolute; top:12px; right:14px;
            background:none; border:none; color:#fff;
            font-size:18px; cursor:pointer;
            text-shadow:-1px -1px 0 #000,1px -1px 0 #000,
                         -1px 1px 0 #000,1px 1px 0 #000;
        }
        .info-close:hover { filter:brightness(1.5); }

        /* ── BANNER TEST SCENE ── */
        #scene-banner-test {
            display:none; position:fixed; inset:0;
            background:rgba(0,0,0,0.95); z-index:100;
            align-items:flex-start; justify-content:center;
            flex-direction:column; gap:24px; padding-top:40px;
        }
        #scene-banner-test.open { display:flex; }

        .bt-panel {
            margin:0 auto;
            background:#141414; border:1px solid #222; border-radius:12px;
            padding:20px 24px; display:flex; flex-direction:column; gap:14px;
            width:calc(100% - 80px); max-width:none; align-self:stretch;
        }
        .bt-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        .bt-label { font-size:12px; opacity:0.6; width:90px; flex-shrink:0; }
        .bt-input {
            background:#1a1a1a; border:1px solid #333; border-radius:6px;
            color:#fff; font-family:'Jersey 15','Segoe UI',sans-serif;
            font-size:14px; padding:6px 10px; outline:none;
            text-shadow:-1px -1px 0 #000,1px -1px 0 #000,
                        -1px 1px 0 #000,1px 1px 0 #000;
        }
        .bt-input:focus { border-color:#7c3aed; }
        .bt-btn {
            background:#7c3aed; border:none; border-radius:6px;
            color:#fff; font-family:'Jersey 15','Segoe UI',sans-serif;
            font-size:14px; padding:6px 14px; cursor:pointer; text-shadow:none;
        }
        .bt-btn:hover { filter:brightness(1.2); }
        .bt-hint { font-size:10px; opacity:0.4; }
        .bt-select {
            background:#1a1a1a; border:1px solid #333; border-radius:6px;
            color:#fff; font-family:'Jersey 15','Segoe UI',sans-serif;
            font-size:13px; padding:5px 8px; outline:none; cursor:pointer;
        }
        .bt-preview-wrap {
            width:calc(100% - 80px); max-width:none;
            position:relative; height:68px; align-self:center;
        }
        #bt-close {
            position:absolute; top:16px; right:20px;
            background:none; border:none; color:#fff; font-size:18px;
            cursor:pointer; z-index:10;
            text-shadow:-1px -1px 0 #000,1px -1px 0 #000,
                        -1px 1px 0 #000,1px 1px 0 #000;
        }
        #bt-close:hover { filter:brightness(1.5); }
        .bt-tiers-grid { display:flex; flex-wrap:wrap; gap:6px; }
        .bt-tier-dropdown { position:relative; display:inline-block; }
        .bt-tier-btn {
            background:#1a1a1a; border:1.5px solid #333; border-radius:6px;
            color:#fff; font-family:'Jersey 15','Segoe UI',sans-serif;
            font-size:12px; padding:4px 8px; cursor:pointer;
            min-width:60px; text-align:center;
            text-shadow:-1px -1px 0 #000,1px -1px 0 #000,
                        -1px 1px 0 #000,1px 1px 0 #000;
        }
        .bt-tier-btn:hover { border-color:#7c3aed; }
        .bt-tier-popup {
            display:none; position:absolute; top:110%; left:0;
            background:#1a1a1a; border:1px solid #333; border-radius:8px;
            padding:6px; z-index:200; min-width:220px;
            flex-wrap:wrap; gap:4px;
        }
        .bt-tier-popup.open { display:flex; }
        .bt-tier-option {
            font-size:11px; font-family:'Jersey 15','Segoe UI',sans-serif;
            padding:4px 8px; border-radius:5px; cursor:pointer;
            border:1.5px solid transparent; text-align:center; min-width:44px;
            text-shadow:-1px -1px 0 #000,1px -1px 0 #000,
                        -1px 1px 0 #000,1px 1px 0 #000;
            background:rgba(0,0,0,0.4);
        }
        .bt-tier-option:hover { filter:brightness(1.3); }
        .bt-tier-option.ht { opacity:1; }
        .bt-tier-option.lt { opacity:0.45; }

        /* ── ALL PAGE ── */
        #page-all { display:flex; flex-direction:column; flex:1; overflow-y:auto; overflow-x:hidden; }
        .player-list { padding:16px 40px; display:flex; flex-direction:column; gap:30px; }
        .player-row {
            position:relative; height:68px; cursor:pointer;
            border-radius:6px; overflow:visible; flex-shrink:0;
            transition:filter 0.15s;
        }
        .player-row:hover { filter:brightness(1.05); }
        .row-bg {
            position:absolute; inset:0; width:100%; height:100%;
            z-index:0; border-radius:6px; overflow:hidden;
        }
        .row-bg svg { width:100%; height:100%; position:absolute; inset:0; }
        .row-content {
            position:absolute; inset:0; display:flex; align-items:center;
            padding:0 22px; gap:12px; z-index:2; overflow:hidden;
        }
        .row-pos {
            font-size:18px; font-weight:900; color:#fff !important;
            text-shadow:-1px -1px 0 #000,1px -1px 0 #000,
                        -1px 1px 0 #000,1px 1px 0 #000 !important;
            width:28px; flex-shrink:0; text-align:center;
        }
        .row-name {
            font-size:15px; font-weight:700; flex-shrink:0; width:160px;
            position:absolute; left:120px; top:50%; transform:translateY(-80%);
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
        }
        .row-title {
            position:absolute; left:120px; top:50%; transform:translateY(40%);
            display:flex; align-items:center; gap:4px;
        }
        .row-title-icon {
            width:14px; height:14px; object-fit:contain;
            filter: drop-shadow(0px 0px 2px rgba(0,0,0,1))
                    drop-shadow(0px 0px 4px rgba(0,0,0,1))
                    drop-shadow(0px 0px 6px rgba(0,0,0,1));
        }
        .row-title-label { font-size:9px; opacity:1; }
        .row-tiers { display:flex; gap:6px; margin-left:auto; align-items:center; flex-shrink:0; }
        .tier-circle-wrap { display:flex; flex-direction:column; align-items:center; gap:0; flex-shrink:0; }

        /* ── STYLE PAGES ── */
        .style-page { display:none; flex:1; flex-direction:column; overflow:hidden; }
        .style-page.open { display:flex; }
        .col-page-inner {
            display:flex; gap:10px; padding:16px 40px 16px;
            flex:1; overflow-x:auto; overflow-y:auto; align-items:flex-start;
        }
        .col-player-card {
            position:relative; height:44px; border-radius:4px;
            overflow:visible; cursor:pointer; flex-shrink:0;
            transition:filter 0.15s;
        }
        .col-player-card:hover { filter:brightness(1.05); }
        .col-card-bg { position:absolute; inset:0; border-radius:4px; overflow:hidden; }
        .col-card-bg svg { width:100%; height:100%; position:absolute; inset:0; }
        .col-card-content {
            position:absolute; inset:0; display:flex; align-items:center;
            gap:6px; padding:0 8px; z-index:2; overflow:hidden;
        }
        .col-rank { font-size:11px; color:#fff !important; width:18px; flex-shrink:0; text-align:right; }
        .col-name { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

        /* ── DETAIL / PLAYER POPUP ── */
        #scene-player {
            display:none; position:fixed; inset:0;
            background:rgba(0,0,0,0.92); z-index:100;
            align-items:center; justify-content:center;
        }
        #scene-player.open { display:flex; }
        .detail-box {
            background:#141414; border:1px solid #222; border-radius:12px;
            width:700px; min-height:360px; position:relative;
            overflow:hidden; display:flex;
        }
        .detail-left {
            width:170px; flex-shrink:0; position:relative;
            display:flex; align-items:center; justify-content:center;
            overflow:visible; min-height:360px; z-index:2;
        }
        .detail-left svg { position:absolute; inset:0; width:100%; height:100%; }
        .detail-right {
            flex:1; padding:28px 28px 24px;
            display:flex; flex-direction:column; gap:12px;
            overflow-y:auto; position:relative; z-index:2;
        }
        .detail-name { font-size:24px; font-weight:900; }
        .detail-pos  { font-size:12px; margin-top:10px; opacity:0.5; }
        .detail-tiers { display:flex; flex-wrap:wrap; gap:10px; margin-top:4px; }
        .detail-tier-item {
            display:flex; flex-direction:column; align-items:center; gap:4px;
            position:relative;
        }
        .detail-style-lbl { font-size:10px; opacity:0.5; }

        /* Sub-tier hover panel in detail popup */
        .detail-sub-tiers {
            display:none;
            position:absolute;
            bottom:calc(100% + 6px);
            left:50%;
            transform:translateX(-50%);
            background:#1a1a1a;
            border:1px solid #333;
            border-radius:8px;
            padding:6px 8px;
            flex-direction:row;
            gap:6px;
            z-index:10;
            white-space:nowrap;
        }
        .detail-tier-item:hover .detail-sub-tiers { display:flex; }

        .close-btn {
            position:absolute; top:12px; right:14px;
            background:none; border:none; color:#fff; font-size:18px;
            cursor:pointer; z-index:10; transition:color 0.1s;
            text-shadow:-1px -1px 0 #000,1px -1px 0 #000,
                        -1px 1px 0 #000,1px 1px 0 #000;
        }
        .close-btn:hover { color:#fff; filter:brightness(1.5); }

        /* ── LOADING ── */
#loading-screen {
    z-index: 9999;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #0d0d0d;
    display: flex;
    align-items: center;
    justify-content: center;
}

#loading-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
}

#loading-skin {
    width: auto;
    height: calc(100vh - 60px);
    max-height: 600px;
    max-width: 100%;
    image-rendering: pixelated;
    display: none;
    object-fit: contain;
}

#loading-bar-wrap {
    width: 220px;
    height: 6px;
    background: #2a2a2a;
    border-radius: 3px;
    position: absolute;
    bottom: 220px;
    left: 50%;
    transform: translateX(-50%);
}

#loading-bar {
    height: 100%;
    background: #7c3aed;
    border-radius: 3px;
    width: 0%;
    transition: width 0.2s ease;
}

#loading-screen.hidden { display: none; }
        #loading-label { font-size:13px; }

        /* ── NEWS ── */
        .news-list { padding:16px 40px; display:flex; flex-direction:column; gap:10px; }
        .news-box {
            position: relative;
            background:#141414; border:1px solid #1e1e1e;position: relative;
            border-radius:8px; padding:18px 22px;
            display:flex; flex-direction:column; gap:8px;
        }
        .news-box.news-unread {
            border-color: #7c3aed;
        }
        .news-date { font-size:10px; color:#444; letter-s
pacing:1px; }
        .news-title { font-size:16px; font-weight:700; color:#fff; }
        .news-body { font-size:13px; color:#aaa; line-height:1.6;white-space: pre-wrap; }
        .tiertest-main { display:flex; gap:16px; align-items:stretch; }
        .tiertest-players {
            display:flex; flex-direction:column; gap:8px;
            flex-shrink:0; justify-content:space-between;
        }
        .tiertest-player { display:flex; flex-direction:column; align-items:center; gap:2px; position:relative; }
        .tiertest-player-name { font-size:11px; color:#fff; white-space:nowrap; }
        .tiertest-player-img { position:relative; width:96px; height:96px; overflow:visible; }
        .tiertest-player-img img {
            position:absolute; left:-103px; top:-97px;
            width:300px; height:300px; pointer-events:none;
        }
        .tiertest-result {
            font-size:18px; font-weight:900;
            font-family:'Jersey 15',sans-serif;
            position:absolute; right:-8px; top:0;
        }
        .tiertest-result.W { color:#4caf50; text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000; }
        .tiertest-result.L { color:#f44336; text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000; }
        .tiertest-result.D { color:#aaa;    text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000; }
        .tiertest-styles { display:flex; flex-direction:row; gap:16px; align-items:stretch; }
        .tiertest-style-row { display:flex; align-items:center; gap:8px; }
        .tiertest-writeup {
            font-size:13px; color:#aaa; line-height:1.6;white-space: pre-wrap;
            border-top:1px solid #1e1e1e; padding-top:12px; margin-top:4px;
        }
    </style>
</head>
<body>
<div id="loading-screen">
    <div id="loading-content">
        <img id="loading-skin" src="" />
        <div id="loading-bar-wrap">
            <div id="loading-bar"></div>
        </div>
    </div>
</div>

<div class="tabs" id="tabs">
    <div style="margin-left:auto;display:flex;align-items:center;gap:0;">
        <button class="tabbar-btn panorama-btn" title="Preview">
            <span class="material-icons" style="color:#fff;font-size:22px;text-shadow:none;pointer-events:none;">panorama</span>
        </button>
        <button class="tabbar-btn" id="info-btn" title="Info">
            <span class="material-icons" style="color:#fff;font-size:22px;text-shadow:none;pointer-events:none;">info</span>
        </button>
<button class="tabbar-btn" id="settings-btn" title="Settings">
    <span class="material-icons" style="color:#fff;font-size:22px;text-shadow:none;pointer-events:none;">settings</span>
</button>
    </div>
</div>

<div id="page-all"><div class="player-list" id="list-all"></div></div>

<div id="page-news" style="display:none;flex:1;flex-direction:column;overflow-y:auto;overflow-x:hidden;">
    <div class="news-list" id="list-news"></div>
</div>

<div id="pages-styles"></div>

<div id="scene-player">
    <div class="detail-box">
        <button class="close-btn" onclick="closeDetail()">✕</button>
        <div class="detail-left" id="detail-left">
            <svg viewBox="0 0 170 360" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="170" height="360" fill="#0f0f0f"/>
                <polygon id="detail-quad" points="0,0 170,0 170,360 0,360" fill="#1e1e1e" opacity="1"/>
            </svg>
        </div>
        <div class="detail-right">
            <div>
                <div class="detail-name" id="detail-name"></div>
                <div class="detail-pos"  id="detail-pos"></div>
                <div class="detail-pos"  id="detail-title-label"></div>
            </div>
            <div class="detail-tiers" id="detail-tiers"></div>
        </div>
    </div>
</div>

<!-- Info popup -->
<div id="scene-info">
    <div class="info-box">
        <button class="info-close" onclick="closeInfo()">✕</button>
        <img class="info-logo" src="https://www.khanacademy.org/computer-programming/assets-wip/6435356132360192/4945022646861824.png" alt="MCTiers">
        <div class="info-email">silas.boram@outlook.com</div>
        <div class="info-body"><br>Want to get tested? Wrong skin or name?<br>Change or add a banner? Retire in a gamemode?<br>Ask a question? Report an issue?<br><br>Contact me.</div>
    </div>
</div>

<div id="scene-settings">
    <div class="info-box">
        <button class="info-close" onclick="closeSettings()">✕</button>
        <div style="font-size:15px;font-weight:700;margin-bottom:4px;">Notifications</div>
        <div style="font-size:11px;color:#aaa;margin-bottom:12px;">What news do you wish to be notified of?</div>
        <div id="settings-checks" style="display:flex;flex-direction:column;gap:10px;width:100%;"></div>
    </div>
</div>

<canvas id="skin-canvas" width="1600" height="1600" style="display:none;"></canvas>

<div id="scene-banner-test">
    <button id="bt-close" onclick="closeBannerTest()">✕</button>
    <div class="bt-panel">
        <div class="bt-row">
            <span class="bt-label">Name</span>
            <input class="bt-input" id="bt-name" type="text" value="Player" oninput="btUpdate()">
        </div>
        <div class="bt-row">
            <span class="bt-label">Banner</span>
            <input type="file" id="bt-file" accept="image/*" style="display:none">
            <button class="bt-btn" onclick="document.getElementById('bt-file').click()">Upload</button>
            <span class="bt-hint">Recommended: 1200 × 68px</span>
        </div>
        <div class="bt-row">
            <span class="bt-label">Rank</span>
            <input class="bt-input" id="bt-rank" type="number" min="1" value="1" style="width:70px;" oninput="btUpdate()">
        </div>
        <div class="bt-row" style="align-items:flex-start;">
            <span class="bt-label" style="padding-top:6px;">Tiers</span>
            <div class="bt-tiers-grid" id="bt-tiers-grid"></div>
        </div>

// R-Tier: prefix "R" means same tier value but with special styling
// Normalise a tier string — strips leading R if present
function normTier(t) {
    if (!t) return "LT5";
    if (t.charAt(0) === 'R') return t.slice(1);
    return t;
}
function isRTier(t) {
    return t && t.charAt(0) === 'R';
}

// Average sub-tiers to produce overall tier for mace / cart
// Returns a tier string like "HT2"
function avgSubTiers(tierArr) {
    var allR = true;
    for (var i = 0; i < tierArr.length; i++) {
        if (!isRTier(tierArr[i])) { allR = false; break; }
    }

    var total = 0;
    for (var i = 0; i < tierArr.length; i++) {
        total += tierOrder.indexOf(normTier(tierArr[i]));
    }
    var avg = Math.round(total / tierArr.length);
    var result = tierOrder[Math.max(0, Math.min(avg, tierOrder.length - 1))];

    return allR ? 'R' + result : result;
}

// Get the effective display tier for a style key from a player's tiers object
function getEffectiveTier(p, styleKey) {
    var style = null;
    for (var i = 0; i < styles.length; i++) {
        if (styles[i].key === styleKey) { style = styles[i]; break; }
    }
    if (!style) return p.tiers[styleKey] || "LT5";
    if (style.subs) {
        var subVals = [];
        for (var s = 0; s < style.subs.length; s++) {
            subVals.push(p.tiers[style.subs[s].key] || "LT5");
        }
        return avgSubTiers(subVals);
    }
    return p.tiers[styleKey] || "LT5";
}

function getPoints(p) {
    var total = 0;
    for (var i = 0; i < styles.length; i++) {
        var t = normTier(getEffectiveTier(p, styles[i].key));
        total += tierPoints[t] || 1;
    }
    return total;
}

function getDisplayPoints(p) {
    return Math.round(getPoints(p)); // rounded for display and title lookup
}
function getTitle(points) {
    var title = titles[0];
    for (var i = 0; i < titles.length; i++) {
        if (points >= titles[i].min) title = titles[i];
    }
    return title;
}

// News prefs: which types count as unread
function getNewsPrefs() {
    var defaults = { text: true, tiertest: true, promotion: true };
    try {
        var stored = localStorage.getItem('mct_news_prefs');
        if (stored) return Object.assign(defaults, JSON.parse(stored));
    } catch(e) {}
    return defaults;
}

function saveNewsPrefs(prefs) {
    try { localStorage.setItem('mct_news_prefs', JSON.stringify(prefs)); } catch(e) {}
}

// Read news: set of news IDs that have been read
function getReadNews() {
    try {
        var stored = localStorage.getItem('mct_read_news');
        if (stored) return JSON.parse(stored);
    } catch(e) {}
    return [];
}

function markNewsRead(id) {
    var read = getReadNews();
    if (read.indexOf(id) === -1) {
        read.push(id);
        try { localStorage.setItem('mct_read_news', JSON.stringify(read)); } catch(e) {}
    }
    updateNewsCount();
}

function getUnreadCount() {
    var prefs = getNewsPrefs();
    var read = getReadNews();
    var count = 0;
    for (var i = 0; i < news.length; i++) {
        var item = news[i];
        // Check if this type is enabled in prefs
        var typeEnabled = prefs[item.type] !== false;
        if (!typeEnabled) continue;
        if (read.indexOf(item.id) === -1) count++;
    }
    return count;
}

function updateNewsCount() {
    var badge = document.getElementById('news-tab-badge');
    if (!badge) return;
    var count = getUnreadCount();
    badge.textContent = count;
    badge.style.opacity = count === 0 ? '0.3' : '1';
}

function vec3(x,y,z){ return {x:x,y:y,z:z}; }
function subV(a,b){ return vec3(a.x-b.x,a.y-b.y,a.z-b.z); }
function crossV(a,b){ return vec3(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x); }
function dotV(a,b){ return a.x*b.x+a.y*b.y+a.z*b.z; }
function normV(a){ var l=Math.sqrt(dotV(a,a))||1; return vec3(a.x/l,a.y/l,a.z/l); }
function scaleV(a,s){ return vec3(a.x*s,a.y*s,a.z*s); }
function rotX(v,a){ var c=Math.cos(a),s=Math.sin(a); return vec3(v.x,v.y*c-v.z*s,v.y*s+v.z*c); }
function rotY(v,a){ var c=Math.cos(a),s=Math.sin(a); return vec3(v.x*c+v.z*s,v.y,-v.x*s+v.z*c); }

var CAM_Z=350, CANVAS_SIZE=1600, CANVAS_HALF=CANVAS_SIZE/2;

function project(v){
    var fov=CAM_Z/(CAM_Z-v.z);
    return {x:CANVAS_HALF+v.x*fov, y:CANVAS_HALF+v.y*fov, z:v.z};
}

function getShade(corners){
    var ab=subV(corners[1],corners[0]), ac=subV(corners[2],corners[0]);
    var n=normV(crossV(ab,ac));
    var sh=[
        {axis:vec3(0,-1,0),shade:1.0},{axis:vec3(0,1,0),shade:0.5},
        {axis:vec3(0,0,1),shade:0.9},{axis:vec3(0,0,-1),shade:0.6},
        {axis:vec3(-1,0,0),shade:0.75},{axis:vec3(1,0,0),shade:0.75}
    ];
    var best=0.7,bestDot=-99;
    for(var i=0;i<sh.length;i++){
        var d=dotV(n,sh[i].axis);
        if(d>bestDot){bestDot=d;best=sh[i].shade;}
    }
    return best;
}

function getFaceCorners(axis,hw,hh,hd){
    if(axis==='front') { return [vec3(-hw,-hh,hd), vec3(hw,-hh,hd), vec3(hw,hh,hd), vec3(-hw,hh,hd)]; }
    if(axis==='back')  { return [vec3(hw,-hh,-hd), vec3(-hw,-hh,-hd), vec3(-hw,hh,-hd), vec3(hw,hh,-hd)]; }
    if(axis==='right') { return [vec3(hw,-hh,-hd), vec3(hw,-hh,hd), vec3(hw,hh,hd), vec3(hw,hh,-hd)]; }
    if(axis==='left')  { return [vec3(-hw,-hh,hd), vec3(-hw,-hh,-hd), vec3(-hw,hh,-hd), vec3(-hw,hh,hd)]; }
    if(axis==='top')   { return [vec3(-hw,-hh,-hd), vec3(hw,-hh,-hd), vec3(hw,-hh,hd), vec3(-hw,-hh,hd)]; }
    if(axis==='bottom'){ return [vec3(-hw,hh,hd), vec3(hw,hh,hd), vec3(hw,hh,-hd), vec3(-hw,hh,-hd)]; }
}

function cropFaceToCanvas(bitmap,palette,bx,by,bw,bh){
    var c=document.createElement("canvas");
    c.width=bw; c.height=bh;
    var cx=c.getContext("2d");
    var id=cx.createImageData(bw,bh);
    for(var row=0;row<bh;row++){
        for(var col=0;col<bw;col++){
            var ch=(bitmap[by+row]&&(bx+col)<bitmap[by+row].length)?bitmap[by+row][bx+col]:' ';
            var p=palette[ch];
            var i=(row*bw+col)*4;
            id.data[i]=p[0]; id.data[i+1]=p[1]; id.data[i+2]=p[2]; id.data[i+3]=p[3];
        }
    }
    cx.putImageData(id,0,0);
    return c;
}

function bilerp(pts,u,v){
    var x=pts[0].x*(1-u)*(1-v)+pts[1].x*u*(1-v)+pts[2].x*u*v+pts[3].x*(1-u)*v;
    var y=pts[0].y*(1-u)*(1-v)+pts[1].y*u*(1-v)+pts[2].y*u*v+pts[3].y*(1-u)*v;
    return {x:x,y:y};
}

function drawTri(ctx,img,p0,p1,p2,u0,v0,u1,v1,u2,v2){
    ctx.imageSmoothingEnabled=false;
    ctx.globalCompositeOperation='source-over';
    var iw=img.width,ih=img.height;
    var sx0=u0*iw,sy0=v0*ih,sx1=u1*iw,sy1=v1*ih,sx2=u2*iw,sy2=v2*ih;
    var denom=sx0*(sy1-sy2)+sx1*(sy2-sy0)+sx2*(sy0-sy1);
    if(Math.abs(denom)<0.0001){return;}
    var a=(p0.x*(sy1-sy2)+p1.x*(sy2-sy0)+p2.x*(sy0-sy1))/denom;
    var b=(p0.x*(sx2-sx1)+p1.x*(sx0-sx2)+p2.x*(sx1-sx0))/denom;
    var c=(p0.x*(sx1*sy2-sx2*sy1)+p1.x*(sx2*sy0-sx0*sy2)+p2.x*(sx0*sy1-sx1*sy0))/denom;
    var d=(p0.y*(sy1-sy2)+p1.y*(sy2-sy0)+p2.y*(sy0-sy1))/denom;
    var e=(p0.y*(sx2-sx1)+p1.y*(sx0-sx2)+p2.y*(sx1-sx0))/denom;
    var f=(p0.y*(sx1*sy2-sx2*sy1)+p1.y*(sx2*sy0-sx0*sy2)+p2.y*(sx0*sy1-sx1*sy0))/denom;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y);
    ctx.closePath(); ctx.clip();
    ctx.transform(a,d,b,e,c,f);
    ctx.drawImage(img,0,0);
    ctx.restore();
}

function drawImageQuad(ctx,img,pts,shade){
    var divs=8;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(pts[0].x,pts[0].y);
    ctx.lineTo(pts[1].x,pts[1].y);
    ctx.lineTo(pts[2].x,pts[2].y);
    ctx.lineTo(pts[3].x,pts[3].y);
    ctx.closePath();
    ctx.clip();
    for(var row=0;row<divs;row++){
        for(var col=0;col<divs;col++){
            var u0=col/divs,     v0=row/divs;
            var u1=(col+1)/divs, v1=(row+1)/divs;
            var p00=bilerp(pts,u0,v0);
            var p10=bilerp(pts,u1,v0);
            var p11=bilerp(pts,u1,v1);
            var p01=bilerp(pts,u0,v1);
            var cx=(p00.x+p10.x+p11.x+p01.x)/4;
            var cy=(p00.y+p10.y+p11.y+p01.y)/4;
            var ex=0.75;
            p00={x:cx+(p00.x-cx)*(1+ex/8),y:cy+(p00.y-cy)*(1+ex/8)};
            p10={x:cx+(p10.x-cx)*(1+ex/8),y:cy+(p10.y-cy)*(1+ex/8)};
            p11={x:cx+(p11.x-cx)*(1+ex/8),y:cy+(p11.y-cy)*(1+ex/8)};
            p01={x:cx+(p01.x-cx)*(1+ex/8),y:cy+(p01.y-cy)*(1+ex/8)};
            drawTri(ctx,img,p00,p10,p11,u0,v0,u1,v0,u1,v1);
            drawTri(ctx,img,p00,p11,p01,u0,v0,u1,v1,u0,v1);
            drawTri(ctx,img,p00,p10,p01,u0,v0,u1,v0,u0,v1);
            drawTri(ctx,img,p10,p11,p01,u1,v0,u1,v1,u0,v1);
        }
    }
    if(shade<1.0){
        ctx.save();
        ctx.globalCompositeOperation='source-atop';
        ctx.beginPath();
        ctx.moveTo(pts[0].x,pts[0].y);
        ctx.lineTo(pts[1].x,pts[1].y);
        ctx.lineTo(pts[2].x,pts[2].y);
        ctx.lineTo(pts[3].x,pts[3].y);
        ctx.closePath();
        ctx.fillStyle='rgba(0,0,0,'+(1-shade)+')';
        ctx.fill();
        ctx.restore();
    }
    ctx.restore();
}

function renderSkin(canvas,player){
    var ctx=canvas.getContext('2d');
    ctx.clearRect(0,0,CANVAS_SIZE,CANVAS_SIZE);
    ctx.globalCompositeOperation='source-over';
    var RX=0.05, RY=-2.41, SCALE=1.59;
    var faceCanvases={};
    for(var i=0;i<faceMap.length;i++){
        var fm=faceMap[i];
        faceCanvases[fm[4]+'-'+fm[5]]=cropFaceToCanvas(player.skinBitmap,player.skinPalette,fm[0],fm[1],fm[2],fm[3]);
    }
    var allFaces=[];
    var axes=['front','back','left','right','top','bottom'];
    for(var di=0;di<partDefs.length;di++){
        var def=partDefs[di];
        for(var ai=0;ai<axes.length;ai++){
            var axis=axes[ai];
            var fc1=faceCanvases[def.key+'-'+axis];
            if(fc1){ allFaces.push({fc:fc1,def:def,axis:axis,expand:0}); }
            var fc2=faceCanvases[def.key+'2-'+axis];
            if(fc2){ allFaces.push({fc:fc2,def:def,axis:axis,expand:2}); }
        }
    }
    for(var i=0;i<allFaces.length;i++){
        var f=allFaces[i];
        var def=f.def;
        var hw=def.hw+f.expand, hh=def.hh+f.expand, hd=def.hd+f.expand;
        var corners=getFaceCorners(f.axis,hw,hh,hd);
        var transformed=[];
        for(var j=0;j<corners.length;j++){
            var v=corners[j];
            if(def.swingAngle!==0&&def.pivot){
                var py=def.pivot.y;
                v=vec3(v.x,v.y-py,v.z);
                v=rotX(v,def.swingAngle);
                v=vec3(v.x,v.y+py,v.z);
            }
            v=vec3(v.x+def.tx, v.y+def.ty-36, v.z+def.tz);
            v=rotX(v,RX); v=rotY(v,RY);
            v=scaleV(v,SCALE);
            transformed.push(v);
        }
        var pts2d=[];
        for(var j=0;j<transformed.length;j++){ pts2d.push(project(transformed[j])); }
        f.pts2d=pts2d;
        f.depth=(transformed[0].z+transformed[1].z+transformed[2].z+transformed[3].z)/4;
        if(def.key==='leftLeg'||def.key==='rightLeg'||
           def.key==='leftLeg2'||def.key==='rightLeg2'){
            f.depth -= 50;
        }
        f.shade=getShade(transformed);
    }
    allFaces.sort(function(a,b){ return (a.depth||0)-(b.depth||0); });
    for(var i=0;i<allFaces.length;i++){
        var f=allFaces[i];
        if(!f.pts2d){continue;}
        drawImageQuad(ctx,f.fc,f.pts2d,f.shade);
    }
}

function preloadSkins(onDone) {
    var i = 0;
    var bar = document.getElementById('loading-bar');
    var skinImg = document.getElementById('loading-skin');

    function next() {
        if (i >= players.length) { onDone(); return; }
        var p = players[i];

        bar.style.width = Math.round((i / players.length) * 100) + '%';

        setTimeout(function() {
            if (p.skinBitmap && p.skinPalette) {
                renderSkin(skinCanvas, p);
                p.avatarUrl = skinCanvas.toDataURL();

                // Show skin image, update to latest loaded
                skinImg.style.display = 'block';
                skinImg.src = p.avatarUrl;
            }

            i++; next();
        }, 10);
    }

    next();
}

var scorePlayer = function(p) {
    var main = -getPoints(p);
    var sub = 0;
    for (var i = 0; i < styles.length; i++) {
        var style = styles[i];
        if (style.subs) {
            for (var s = 0; s < style.subs.length; s++) {
                sub += tierPoints[normTier(p.tiers[style.subs[s].key] || "LT5")] || 1;
            }
        }
    }
    var score = main - (sub / 10000);
    return p.alt ? score + 999999 : score;
};

var sortedPlayers = players.slice().sort(function(a, b) {
    return scorePlayer(a) - scorePlayer(b);
});

var rankCounter = 0;
for (var i = 0; i < sortedPlayers.length; i++) {
    if (sortedPlayers[i].alt) {
        sortedPlayers[i]._rank = -1; // flag as alt
        continue;
    }
    if (i === 0 || sortedPlayers[i-1].alt) {
        sortedPlayers[i]._rank = rankCounter;
    } else {
        var prevPoints = getPoints(sortedPlayers[i-1]);
        var currPoints = getPoints(sortedPlayers[i]);
        if (Math.abs(prevPoints - currPoints) < 0.01) {
            sortedPlayers[i]._rank = sortedPlayers[i-1]._rank;
        } else {
            rankCounter = i;
            sortedPlayers[i]._rank = i;
        }
    }
    rankCounter = sortedPlayers[i]._rank;
}

// ============================================================
var makeRowSVG = function(rank, uid) {
    uid = uid !== undefined ? uid : rank;
    var rc = rowColors[Math.min(rank, 3)];
    return {
        bg:
            '<svg width="100%" height="100%" viewBox="0 0 1000 68" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">' +
            '<rect width="1000" height="68" rx="6" ry="6" fill="' + rc.bg + '" opacity="1"/></svg>',
        poly:
            '<svg width="100%" height="100%" viewBox="0 0 1000 68" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">' +
            '<defs><clipPath id="shineClip' + uid + '">' +
            '<polygon points="0,68 50,68 213,0 155,0 100,0 0,52"/>' +
            '</clipPath></defs>' +
            '<polygon points="0,0 175,0 220,68 0,68" fill="' + rc.quad + '" opacity="1"/>' +
            '<polygon points="0,0 175,0 220,68 0,68" fill="' + rc.quadLight + '" opacity="1" clip-path="url(#shineClip' + uid + ')"/>' +
            '</svg>'
    };
};

// ============================================================
// ICON HTML
// ============================================================
var makeIconHTML = function(style, size) {
    if (style.iconUrl) {
        return '<img src="' + style.iconUrl + '" width="' + size + '" height="' + size +
               '" style="object-fit:contain;image-rendering:auto;" alt="' + style.label + '">';
    }
    return '<span style="font-size:' + size + 'px;line-height:1;">' + style.emoji + '</span>';
};

// ============================================================
// TIER CIRCLE  (supports R-Tier: glow + opaque outline)
// ============================================================
var makeTierCircle = function(tier, style, circleSize) {
    circleSize = circleSize || 44;

    var isR = isRTier(tier);
    var baseTier = normTier(tier);
    var tc = tierColors[baseTier] || { bg:"#0d0d0d", stroke:"#282828", text:"#4e4e4e", ring:"grey", glow:null };

    var ringUrl = RING_URLS[tc.ring];
    var cx = circleSize / 2, cy = circleSize / 2;
    var rectY = cy + (circleSize / 2 - 2) * 0.50;
    var rectH = circleSize * 0.30;
    var totalH = rectY + rectH + 3;
    var lblSz = circleSize * 0.20;
    var iconSz = circleSize * 0.5;

    // R-Tier always glows (like HT) but with fully opaque outline
    var glowColor = isR ? tc.stroke : tc.glow;
    var glowEl = '';
    if (glowColor) {
        var rw = circleSize * 0.55, rh = circleSize * 0.26;
        var rx = cx - rw / 2, ry = rectY + rectH * 0.05;
        // R-Tier: opaque outline rect around label area
        var outlineEl = isR
            ? '<rect x="' + rx + '" y="' + ry + '" width="' + rw + '" height="' + rh + '" rx="4" ry="4" ' +
              'fill="none" stroke="' + tc.stroke + '" stroke-width="0.4" opacity="1"/>'
            : '';
        glowEl =
            '<rect x="' + rx + '" y="' + ry + '" width="' + rw + '" height="' + rh + '" rx="4" ry="4" ' +
            'fill="' + glowColor + '" opacity="0.18" filter="url(#glowF)"/>' +
            outlineEl;
    }

    // Display label: show full tier string (including R prefix)
    var displayLabel = tier;

    return (
        '<svg width="' + circleSize + '" height="' + totalH + '" viewBox="0 0 ' + circleSize + ' ' + totalH + '" xmlns="http://www.w3.org/2000/svg">' +
        '<defs>' +
        '<filter id="glowF" x="-50%" y="-50%" width="200%" height="200%">' +
        '<feGaussianBlur stdDeviation="2.5" result="blur"/>' +
        '<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>' +
        '</filter>' +
        '</defs>' +
        '<image href="' + ringUrl + '" x="0" y="0" width="' + circleSize + '" height="' + circleSize + '"/>' +
        '<image href="' + style.iconUrl + '" x="' + (cx - iconSz/2) + '" y="' + (cy - iconSz/2) + '" width="' + iconSz + '" height="' + iconSz + '"/>' +
        glowEl +
        '<text x="' + cx + '" y="' + (rectY + rectH * 0.67) + '" text-anchor="middle" fill="white" stroke="black" stroke-width="0.5" paint-order="stroke" font-size="' + lblSz + '" font-weight="700" font-family="Jersey 15,Segoe UI,sans-serif">' + displayLabel + '</text>' +
        '</svg>'
    );
};

// ============================================================
var addTab = function(label, style, key) {
    var tab = document.createElement("div");
    tab.className = "tab" + (key === "all" ? " active" : "");
    if (style && style.subs) tab.className += " has-sub";

    var iconPart = style ? '<span class="tab-icon">' + makeIconHTML(style, 14) + '</span>' : '';
    tab.innerHTML = iconPart + label;

if (key === 'news') {
    var badge = document.createElement('div');
    badge.id = 'news-tab-badge';
    badge.textContent = '0';
badge.style.cssText =
    'width:16px;height:16px;border-radius:50%;' +
    'border:1.5px solid #fff;' +
    'font-size:10px;line-height:13px;text-align:center;' +
    'color:#fff;text-shadow:none;flex-shrink:0;opacity:0.3;';
    tab.appendChild(badge);
}

    // Sub-mode dropdown arrow + menu
    if (style && style.subs) {
        var arrow = document.createElement("span");
        arrow.className = "material-icons tab-arrow";
        arrow.textContent = "arrow_drop_down_circle";
        tab.appendChild(arrow);

        var submenu = document.createElement("div");
        submenu.className = "tab-submenu";

        for (var si = 0; si < style.subs.length; si++) {
            (function(sub) {
                var item = document.createElement("div");
                item.className = "tab-subitem";
                item.innerHTML = '<img src="' + sub.iconUrl + '">' + sub.label;
                item.addEventListener("click", function(e) {
                    e.stopPropagation();
                    submenu.classList.remove("open");
                    switchTab(key, sub.key);
                });
                submenu.appendChild(item);
            })(style.subs[si]);
        }

        tab.appendChild(submenu);

        // Arrow click opens/closes submenu
        arrow.addEventListener("click", function(e) {
            e.stopPropagation();
            // Close all other submenus
            document.querySelectorAll(".tab-submenu").forEach(function(m) {
                if (m !== submenu) m.classList.remove("open");
            });
            submenu.classList.toggle("open");
        });
    }

    // Main tab click switches to overall view
    tab.addEventListener("click", function(e) {
        // Don't re-fire if arrow was clicked
        if (e.target.classList && e.target.classList.contains("tab-arrow")) return;
        if (e.target.classList && e.target.classList.contains("material-icons")) return;
        switchTab(key);
    });

    var utilWrapper = tabsEl.querySelector(".panorama-btn").parentElement;
    tabsEl.insertBefore(tab, utilWrapper);
};

                var t;

                    // Filter by sub-mode tier
                    t = p.tiers[subKey] || "LT5";

                    t = getEffectiveTier(p, style.key);
                }
                var baseT = normTier(t);
                var tNum = parseInt(baseT.replace("HT","").replace("LT",""));
                var colNum = parseInt(colDef.label.replace("T",""));
                if (tNum === colNum) {
                    entries.push({ player: p, rank: pi, tier: t });

                var aIdx = tierOrder.indexOf(normTier(a.tier));

                    arrowEl.style.cssText =
                        'position:absolute;right:6px;top:50%;transform:translateY(-50%);' +
                        'display:flex;align-items:center;z-index:3;';
                    var arrowIcon = document.createElement("span");
                    arrowIcon.className = "material-icons";
                    var isR = isRTier(entry.tier);

                    arrowIcon.textContent = baseTier.indexOf("HT") === 0
                        ? "keyboard_double_arrow_up"
                        : "keyboard_arrow_up";
                    arrowEl.appendChild(arrowIcon);
                    card.appendChild(arrowEl);

                    var nameEl = document.createElement("div");
                    nameEl.className = "col-name";
                    nameEl.textContent = entry.player.name;
                    nameEl.style.position = 'absolute';
                    nameEl.style.left = '55px';
                    cc.appendChild(nameEl);

                    card.appendChild(cc);

                    if (entry.player.avatarUrl) {
                        var img = document.createElement("img");
                        img.src = entry.player.avatarUrl;
                        img.style.cssText =
                            'position:absolute;left:-40px;top:-52px;' +
                            'width:160px;height:160px;z-index:4;pointer-events:none;';
                        card.appendChild(img);
                    }

                    card.addEventListener("click", function() {
                        openDetail(entry.player, entry.rank);
                    });
                    colBody.appendChild(card);
                })(entries[ei]);
            }

            col.appendChild(colBody);
            inner.appendChild(col);
        })(colTiers[ci]);
    }
}

// ============================================================
// SWITCH TAB  (resets sub-mode to overall on tab change)
// ============================================================
// Track current active sub-mode per style key
var activeSubModes = {};

var switchTab = function(key, subKey) {
    // Hide all pages
    document.getElementById("page-all").style.display = key === "all" ? "flex" : "none";
    document.getElementById("page-news").style.display = key === "news" ? "flex" : "none";

    var sPages = document.querySelectorAll(".style-page");
    for (var i = 0; i < sPages.length; i++) { sPages[i].classList.remove("open"); }

    if (key !== "all" && key !== "news") {
        var pg = document.getElementById("page-" + key);
        if (pg) {
            pg.classList.add("open");

            // Find the style object
            var style = null;
            for (var s = 0; s < styles.length; s++) {
                if (styles[s].key === key) { style = styles[s]; break; }
            }

            if (style && style.subs) {
                var inner = pg.querySelector(".col-page-inner");
                var subBar = pg.querySelector("[data-subkey]") &&
                             pg.querySelector("[data-subkey]").parentElement;

                if (subKey) {
                    // Switching to a sub-mode
                    activeSubModes[key] = subKey;
                } else {
                    // Coming back to this tab without a subKey — reset to overall
                    activeSubModes[key] = null;
                }

                // Highlight correct sub-bar button
                if (subBar) {
                    var allBtns = subBar.querySelectorAll ? subBar.querySelectorAll("[data-subkey]") : [];
                    for (var b = 0; b < allBtns.length; b++) {
                        allBtns[b].style.background = "transparent";
                    }
                    var activeKey = activeSubModes[key] || "";
                    for (var b = 0; b < allBtns.length; b++) {
                        if (allBtns[b].dataset.subkey === activeKey) {
                            allBtns[b].style.background = "rgba(124,58,237,0.18)";
                        }
                    }
                }

                // Rebuild columns for the correct sub-mode
                if (inner) {
                    rebuildStyleColumns(inner, style, [
                        { label:"T1", tiers:["HT1","LT1"], stroke:"#FFD700", bg:"#130f00", fill:"#FFD700" },
                        { label:"T2", tiers:["HT2","LT2"], stroke:"#C0C0C0", bg:"#111",    fill:"#C0C0C0" },
                        { label:"T3", tiers:["HT3","LT3"], stroke:"#CD7F32", bg:"#100800", fill:"#CD7F32" },
                        { label:"T4", tiers:["HT4","LT4"], stroke:"#383838", bg:"#0d0d0d", fill:"#555"    },
                        { label:"T5", tiers:["HT5","LT5"], stroke:"#282828", bg:"#0d0d0d", fill:"#444"    }
                    ], activeSubModes[key] || null);
                }
            }
        }
    }

    // Update active tab highlight
    var tabs = document.querySelectorAll(".tab");
    var allKeys = ["all", "news"].concat(styles.map(function(s) { return s.key; }));
    for (var i = 0; i < tabs.length; i++) {
        tabs[i].classList.remove("active");
        if (allKeys[i] === key) { tabs[i].classList.add("active"); }
    }

    // Close any open sub-menus
    document.querySelectorAll(".tab-submenu").forEach(function(m) {
        m.classList.remove("open");
    });
};

// ============================================================
// DETAIL POPUP  (with sub-tier hover panels)
// ============================================================
var openDetail = function(player, rank) {
    document.getElementById("detail-name").textContent = player.name;

    var points = getPoints(player);
    var title = getTitle(getDisplayPoints(player));
    document.getElementById("detail-pos").textContent = player.alt ? "ALT" : "Global Rank #" + (player._rank + 1);
    document.getElementById("detail-title-label").textContent = title.label + " • " + getDisplayPoints(player) + " pts";

    var rc = rowColors[Math.min(rank, 3)];
    var dq = document.getElementById("detail-quad");
    dq.setAttribute("fill", rc.quad);
    dq.setAttribute("opacity", "0.9");

    // Shine polygon
    var existingShine = document.getElementById("detail-shine");
    if (existingShine) existingShine.parentNode.removeChild(existingShine);
    var shinePoly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
    shinePoly.setAttribute("id", "detail-shine");
    shinePoly.setAttribute("points", "0,360 50,360 213,90 170,0 110,0 0,260");
    shinePoly.setAttribute("fill", rc.quadLight);
    dq.parentNode.appendChild(shinePoly);

    // Avatar
    var detailLeft = document.getElementById("detail-left");
    var oldImg = detailLeft.querySelector("img");
    if (oldImg) detailLeft.removeChild(oldImg);
    if (player.avatarUrl) {
        var img = document.createElement("img");
        img.src = player.avatarUrl;
        img.style.cssText =
            'position:absolute;left:-360px;top:-240px;' +
            'width:900px;height:900px;z-index:3;pointer-events:none;';
        detailLeft.appendChild(img);
    }

    // Tier circles with sub-tier hover panels
    var tiersEl = document.getElementById("detail-tiers");
    tiersEl.innerHTML = "";

    for (var i = 0; i < styles.length; i++) {
        (function(style) {
            var t = getEffectiveTier(player, style.key);
            var item = document.createElement("div");
            item.className = "detail-tier-item";

            item.innerHTML =
                makeTierCircle(t, style, 52) +
                '<div class="detail-style-lbl">' + style.label + '</div>';

            // Sub-tier hover panel for styles with subs
            if (style.subs) {
                var subPanel = document.createElement("div");
                subPanel.className = "detail-sub-tiers";

                for (var si = 0; si < style.subs.length; si++) {
                    (function(sub) {
                        var subT = player.tiers[sub.key] || "LT5";
                        var subWrap = document.createElement("div");
                        subWrap.style.cssText =
                            'display:flex;flex-direction:column;align-items:center;gap:3px;';
                        subWrap.innerHTML =
                            makeTierCircle(subT, sub, 36) +
                            '<div style="font-size:9px;opacity:0.5;">' + sub.label + '</div>';
                        subPanel.appendChild(subWrap);
                    })(style.subs[si]);
                }

                item.appendChild(subPanel);
            }

            tiersEl.appendChild(item);
        })(styles[i]);
    }

    // Title background image
    var oldTitleBg = document.getElementById("detail-title-bg");
    if (oldTitleBg) oldTitleBg.parentNode.removeChild(oldTitleBg);
    var titleBgImg = document.createElement("img");
    titleBgImg.id = "detail-title-bg";
    titleBgImg.src = title.iconUrl;
    titleBgImg.style.cssText =
        'position:absolute;right:-23%;top:50%;transform:translateY(-50%);' +
        'height:115%;width:auto;opacity:0.3;pointer-events:none;' +
        'z-index:1;object-fit:contain;';
    document.querySelector(".detail-box").appendChild(titleBgImg);

    document.getElementById("scene-player").classList.add("open");
};

var closeDetail = function() {
    document.getElementById("scene-player").classList.remove("open");
};

document.getElementById("scene-player").addEventListener("click", function(e) {
    if (e.target === this) { closeDetail(); }
});

// ============================================================
// BANNER TEST STATE
// ============================================================
var btState = {
    name: "TestPlayer",
    bannerUrl: null,
    rank: 0,
    tiers: {
        vanilla:"LT5", sword:"LT5", axe:"LT5", pot:"LT5", smp:"LT5",
        smace:"LT5", rmace:"LT5", emace:"LT5",
        bcart:"LT5", xbow:"LT5",
        uhc:"LT5"
    },
    avatarUrl: null
};

var tierOptionColors = {
    "HT1":"#FFD700","HT2":"#C0C0C0","HT3":"#CD7F32","HT4":"#555","HT5":"#444",
    "LT1":"#FFD700","LT2":"#C0C0C0","LT3":"#CD7F32","LT4":"#555","LT5":"#444"
};

// ============================================================
// BANNER TEST TIERS GRID
// ============================================================
function buildBtTiersGrid() {
    var grid = document.getElementById("bt-tiers-grid");
    grid.innerHTML = "";

    // Show all sub-mode keys individually
    var btStyleKeys = [];
    for (var si = 0; si < styles.length; si++) {
        var s = styles[si];
        if (s.subs) {
            for (var sbi = 0; sbi < s.subs.length; sbi++) {
                btStyleKeys.push({ key: s.subs[sbi].key, label: s.subs[sbi].label });
            }
        } else {
            btStyleKeys.push({ key: s.key, label: s.label });
        }
    }

    for (var ki = 0; ki < btStyleKeys.length; ki++) {
        (function(entry) {
            var wrap = document.createElement("div");
            wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:3px;';

            var lbl = document.createElement("div");
            lbl.style.cssText = 'font-size:9px;opacity:0.5;text-align:center;';
            lbl.textContent = entry.label;
            wrap.appendChild(lbl);

            var dropdown = document.createElement("div");
            dropdown.className = "bt-tier-dropdown";

            var btn = document.createElement("div");
            btn.className = "bt-tier-btn";
            btn.textContent = btState.tiers[entry.key] || "LT5";
            var btnColor = tierOptionColors[btState.tiers[entry.key]] || "#555";
            btn.style.borderColor = btnColor;
            btn.style.color = btnColor;

            var popup = document.createElement("div");
            popup.className = "bt-tier-popup";

            var allTiers = ["HT1","LT1","HT2","LT2","HT3","LT3","HT4","LT4","HT5","LT5"];
            for (var ti = 0; ti < allTiers.length; ti++) {
                (function(tier) {
                    var opt = document.createElement("div");
                    opt.className = "bt-tier-option " + (tier.indexOf("HT") === 0 ? "ht" : "lt");
                    opt.textContent = tier;
                    var col = tierOptionColors[tier] || "#555";
                    opt.style.borderColor = col;
                    opt.style.color = col;
                    opt.addEventListener("click", function(e) {
                        e.stopPropagation();
                        btState.tiers[entry.key] = tier;
                        popup.classList.remove("open");
                        buildBtTiersGrid();
                        btUpdate();
                    });
                    popup.appendChild(opt);
                })(allTiers[ti]);
            }

            btn.addEventListener("click", function(e) {
                e.stopPropagation();
                document.querySelectorAll(".bt-tier-popup").forEach(function(p) {
                    p.classList.remove("open");
                });
                popup.classList.toggle("open");
            });

            dropdown.appendChild(btn);
            dropdown.appendChild(popup);
            wrap.appendChild(dropdown);
            grid.appendChild(wrap);
        })(btStyleKeys[ki]);
    }
}

// ============================================================
// BANNER TEST UPDATE + DRAW PREVIEW
// ============================================================
function btUpdate() {
    btState.name = document.getElementById("bt-name").value || "TestPlayer";
    var rankVal = parseInt(document.getElementById("bt-rank").value) || 1;
    btState.rank = Math.max(0, Math.min(rankVal - 1, sortedPlayers.length - 1));

    var skinSel = document.getElementById("bt-skin").value;
    if (skinSel !== "") {
        var sp = sortedPlayers[parseInt(skinSel)];
        btState.avatarUrl = sp ? sp.avatarUrl : null;
    } else {
        btState.avatarUrl = null;
    }
    btDrawPreview();
}

function btDrawPreview() {
    var preview = document.getElementById("bt-preview");
    preview.innerHTML = "";

    var p = {
        name: btState.name,
        tiers: btState.tiers,
        bannerUrl: btState.bannerUrl,
        avatarUrl: btState.avatarUrl
    };
    var rank = btState.rank;

    var row = document.createElement("div");
    row.className = "player-row";
    row.style.cssText = 'width:100%;height:68px;cursor:default;';

    var rc = makeRowSVG(rank, 'preview');

    var bgDiv = document.createElement("div");
    bgDiv.className = "row-bg";
    bgDiv.innerHTML = rc.bg;
    row.appendChild(bgDiv);

    if (p.bannerUrl) {
        var banner = document.createElement("img");
        banner.src = p.bannerUrl;
        banner.style.cssText =
            'position:absolute;inset:0;width:100%;height:100%;' +
            'object-fit:cover;border-radius:6px;opacity:0.4;pointer-events:none;z-index:1;';
        row.appendChild(banner);
    }

    // Quad shine on left polygon (same as makeRowSVG poly)
    var polyDiv = document.createElement("div");
    polyDiv.className = "row-bg";
    polyDiv.innerHTML = rc.poly;
    polyDiv.style.zIndex = "2";
    row.appendChild(polyDiv);

    var content = document.createElement("div");
    content.className = "row-content";

    var posEl = document.createElement("div");
    posEl.className = "row-pos";
    posEl.textContent = rank + 1;
    content.appendChild(posEl);

    var nameEl = document.createElement("div");
    nameEl.className = "row-name";
    nameEl.textContent = p.name;
    content.appendChild(nameEl);

    var points = getPoints(p);
    var title = getTitle(getDisplayPoints(p));
    var titleEl = document.createElement("div");
    titleEl.className = "row-title";
    var titleIcon = document.createElement("img");
    titleIcon.src = title.iconUrl;
    titleIcon.className = "row-title-icon";
    var titleLabel = document.createElement("div");
    titleLabel.className = "row-title-label";
    titleLabel.textContent = title.label + " • " + getDisplayPoints(p) + " pts";
    titleEl.appendChild(titleIcon);
    titleEl.appendChild(titleLabel);
    content.appendChild(titleEl);

    var tiersEl = document.createElement("div");
    tiersEl.className = "row-tiers";
    for (var j = 0; j < styles.length; j++) {
        var t = getEffectiveTier(p, styles[j].key);
        var wrap = document.createElement("div");
        wrap.className = "tier-circle-wrap";
        wrap.innerHTML = makeTierCircle(t, styles[j], 42);
        tiersEl.appendChild(wrap);
    }
    content.appendChild(tiersEl);
    row.appendChild(content);

    if (p.avatarUrl) {
        var img = document.createElement("img");
        img.src = p.avatarUrl;
        img.style.cssText =
            'position:absolute;left:-120px;top:-155px;' +
            'width:400px;height:400px;z-index:4;pointer-events:none;';
        row.appendChild(img);
    }

    preview.appendChild(row);
}

// ============================================================
// OPEN / CLOSE BANNER TEST
// ============================================================
function openBannerTest() {
    var sel = document.getElementById("bt-skin");
    sel.innerHTML = '<option value="">— none —</option>';
    for (var i = 0; i < sortedPlayers.length; i++) {
        if (sortedPlayers[i].avatarUrl) {
            var opt = document.createElement("option");
            opt.value = i;
            opt.textContent = sortedPlayers[i].name;
            sel.appendChild(opt);
        }
    }

    var fileEl = document.getElementById("bt-file");
    if (!fileEl._listenerAttached) {
        fileEl._listenerAttached = true;
        fileEl.addEventListener("change", function() {
            var file = this.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                btState.bannerUrl = e.target.result;
                btUpdate();
            };
            reader.readAsDataURL(file);
        });
    }

    buildBtTiersGrid();
    btDrawPreview();
    document.getElementById("scene-banner-test").classList.add("open");
}

function closeBannerTest() {
    document.getElementById("scene-banner-test").classList.remove("open");
}
