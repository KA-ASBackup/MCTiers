// ============================================================
// SKIN RENDERER — new texture-mapped quad version
// ============================================================
function vec3(x,y,z){ return {x:x,y:y,z:z}; }
function subV(a,b){ return vec3(a.x-b.x,a.y-b.y,a.z-b.z); }
function crossV(a,b){ return vec3(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x); }
function dotV(a,b){ return a.x*b.x+a.y*b.y+a.z*b.z; }
function normV(a){ var l=Math.sqrt(dotV(a,a))||1; return vec3(a.x/l,a.y/l,a.z/l); }
function scaleV(a,s){ return vec3(a.x*s,a.y*s,a.z*s); }
function rotX(v,a){ var c=Math.cos(a),s=Math.sin(a); return vec3(v.x,v.y*c-v.z*s,v.y*s+v.z*c); }
function rotY(v,a){ var c=Math.cos(a),s=Math.sin(a); return vec3(v.x*c+v.z*s,v.y,-v.x*s+v.z*c); }

var CAM_Z=350, CANVAS_SIZE=1600, CANVAS_HALF=CANVAS_SIZE/2;

function project(v){
    var fov=CAM_Z/(CAM_Z-v.z);
    return {x:CANVAS_HALF+v.x*fov, y:CANVAS_HALF+v.y*fov, z:v.z};
}

function getShade(corners){
    var ab=subV(corners[1],corners[0]), ac=subV(corners[2],corners[0]);
    var n=normV(crossV(ab,ac));
    var sh=[
        {axis:vec3(0,-1,0),shade:1.0},{axis:vec3(0,1,0),shade:0.5},
        {axis:vec3(0,0,1),shade:0.9},{axis:vec3(0,0,-1),shade:0.6},
        {axis:vec3(-1,0,0),shade:0.75},{axis:vec3(1,0,0),shade:0.75}
    ];
    var best=0.7,bestDot=-99;
    for(var i=0;i<sh.length;i++){
        var d=dotV(n,sh[i].axis);
        if(d>bestDot){bestDot=d;best=sh[i].shade;}
    }
    return best;
}

function getFaceCorners(axis,hw,hh,hd){
    if(axis==='front') { return [vec3(-hw,-hh,hd), vec3(hw,-hh,hd), vec3(hw,hh,hd), vec3(-hw,hh,hd)]; }
    if(axis==='back')  { return [vec3(hw,-hh,-hd), vec3(-hw,-hh,-hd), vec3(-hw,hh,-hd), vec3(hw,hh,-hd)]; }
    if(axis==='right') { return [vec3(hw,-hh,-hd), vec3(hw,-hh,hd), vec3(hw,hh,hd), vec3(hw,hh,-hd)]; }
    if(axis==='left')  { return [vec3(-hw,-hh,hd), vec3(-hw,-hh,-hd), vec3(-hw,hh,-hd), vec3(-hw,hh,hd)]; }
    if(axis==='top')   { return [vec3(-hw,-hh,-hd), vec3(hw,-hh,-hd), vec3(hw,-hh,hd), vec3(-hw,-hh,hd)]; }
    if(axis==='bottom'){ return [vec3(-hw,hh,hd), vec3(hw,hh,hd), vec3(hw,hh,-hd), vec3(-hw,hh,-hd)]; }
}

function cropFaceToCanvas(bitmap,palette,bx,by,bw,bh){
    var c=document.createElement("canvas");
    c.width=bw; c.height=bh;
    var cx=c.getContext("2d");
    var id=cx.createImageData(bw,bh);
    for(var row=0;row<bh;row++){
        for(var col=0;col<bw;col++){
            var ch=(bitmap[by+row]&&(bx+col)<bitmap[by+row].length)?bitmap[by+row][bx+col]:' ';
            var p=palette[ch];
            var i=(row*bw+col)*4;
            id.data[i]=p[0]; id.data[i+1]=p[1]; id.data[i+2]=p[2]; id.data[i+3]=p[3];
        }
    }
    cx.putImageData(id,0,0);
    return c;
}

function bilerp(pts,u,v){
    var x=pts[0].x*(1-u)*(1-v)+pts[1].x*u*(1-v)+pts[2].x*u*v+pts[3].x*(1-u)*v;
    var y=pts[0].y*(1-u)*(1-v)+pts[1].y*u*(1-v)+pts[2].y*u*v+pts[3].y*(1-u)*v;
    return {x:x,y:y};
}

function drawTri(ctx,img,p0,p1,p2,u0,v0,u1,v1,u2,v2){
    ctx.imageSmoothingEnabled=false;
ctx.globalCompositeOperation='source-over';
    var iw=img.width,ih=img.height;
    var sx0=u0*iw,sy0=v0*ih,sx1=u1*iw,sy1=v1*ih,sx2=u2*iw,sy2=v2*ih;
    var denom=sx0*(sy1-sy2)+sx1*(sy2-sy0)+sx2*(sy0-sy1);
    if(Math.abs(denom)<0.0001){return;}
    var a=(p0.x*(sy1-sy2)+p1.x*(sy2-sy0)+p2.x*(sy0-sy1))/denom;
    var b=(p0.x*(sx2-sx1)+p1.x*(sx0-sx2)+p2.x*(sx1-sx0))/denom;
    var c=(p0.x*(sx1*sy2-sx2*sy1)+p1.x*(sx2*sy0-sx0*sy2)+p2.x*(sx0*sy1-sx1*sy0))/denom;
    var d=(p0.y*(sy1-sy2)+p1.y*(sy2-sy0)+p2.y*(sy0-sy1))/denom;
    var e=(p0.y*(sx2-sx1)+p1.y*(sx0-sx2)+p2.y*(sx1-sx0))/denom;
    var f=(p0.y*(sx1*sy2-sx2*sy1)+p1.y*(sx2*sy0-sx0*sy2)+p2.y*(sx0*sy1-sx1*sy0))/denom;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y);
    ctx.closePath(); ctx.clip();
    ctx.transform(a,d,b,e,c,f);
    ctx.drawImage(img,0,0);
    ctx.restore();
}

function drawImageQuad(ctx,img,pts,shade){
    var divs=8;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(pts[0].x,pts[0].y);
    ctx.lineTo(pts[1].x,pts[1].y);
    ctx.lineTo(pts[2].x,pts[2].y);
    ctx.lineTo(pts[3].x,pts[3].y);
    ctx.closePath();
    ctx.clip();
    for(var row=0;row<divs;row++){
        for(var col=0;col<divs;col++){
            var u0=col/divs,     v0=row/divs;
            var u1=(col+1)/divs, v1=(row+1)/divs;
            var p00=bilerp(pts,u0,v0);
            var p10=bilerp(pts,u1,v0);
            var p11=bilerp(pts,u1,v1);
            var p01=bilerp(pts,u0,v1);
            var cx=(p00.x+p10.x+p11.x+p01.x)/4;
            var cy=(p00.y+p10.y+p11.y+p01.y)/4;
            var ex=0.75;
            p00={x:cx+(p00.x-cx)*(1+ex/8),y:cy+(p00.y-cy)*(1+ex/8)};
            p10={x:cx+(p10.x-cx)*(1+ex/8),y:cy+(p10.y-cy)*(1+ex/8)};
            p11={x:cx+(p11.x-cx)*(1+ex/8),y:cy+(p11.y-cy)*(1+ex/8)};
            p01={x:cx+(p01.x-cx)*(1+ex/8),y:cy+(p01.y-cy)*(1+ex/8)};
            drawTri(ctx,img,p00,p10,p11,u0,v0,u1,v0,u1,v1);
            drawTri(ctx,img,p00,p11,p01,u0,v0,u1,v1,u0,v1);
            drawTri(ctx,img,p00,p10,p01,u0,v0,u1,v0,u0,v1);
            drawTri(ctx,img,p10,p11,p01,u1,v0,u1,v1,u0,v1);
        }
    }
if(shade<1.0){
    ctx.save();
    ctx.globalCompositeOperation='source-atop';
    ctx.beginPath();
    ctx.moveTo(pts[0].x,pts[0].y);
    ctx.lineTo(pts[1].x,pts[1].y);
    ctx.lineTo(pts[2].x,pts[2].y);
    ctx.lineTo(pts[3].x,pts[3].y);
    ctx.closePath();
    ctx.fillStyle='rgba(0,0,0,'+(1-shade)+')';
    ctx.fill();
    ctx.restore();
}
    ctx.restore();
}

    {key:'rightArm',  hw:12,hh:36,hd:12, tx:-36, ty:0,  tz:0, pivot:{y:-36}, swingAngle:0.42 },
    {key:'leftArm', hw:12,hh:36,hd:12, tx:36,  ty:0,  tz:0, pivot:{y:-36}, swingAngle:-0.42},
    {key:'body',     hw:24,hh:36,hd:12, tx:0,   ty:0,  tz:0, pivot:null,    swingAngle:0    },
    {key:'head',     hw:24,hh:24,hd:24, tx:0,   ty:-60,tz:0, pivot:null,    swingAngle:0    }
];

function renderSkin(canvas,player){
    var activeDefs = partDefs;
    var ctx=canvas.getContext('2d');
ctx.clearRect(0,0,CANVAS_SIZE,CANVAS_SIZE);
ctx.globalCompositeOperation='source-over';

    var RX=0.05, RY=-2.41, SCALE=1.59;

    // build face canvases for this player
    var faceCanvases={};
    for(var i=0;i<faceMap.length;i++){
        var fm=faceMap[i];
        faceCanvases[fm[4]+'-'+fm[5]]=cropFaceToCanvas(player.skinBitmap,player.skinPalette,fm[0],fm[1],fm[2],fm[3]);
    }

    var allFaces=[];
    var axes=['front','back','left','right','top','bottom'];

    for(var di=0;di<activeDefs.length;di++){
        var def=activeDefs[di];
        for(var ai=0;ai<axes.length;ai++){
            var axis=axes[ai];
            var fc1=faceCanvases[def.key+'-'+axis];
            if(fc1){ allFaces.push({fc:fc1,def:def,axis:axis,expand:0}); }
            var fc2=faceCanvases[def.key+'2-'+axis];
            if(fc2){ allFaces.push({fc:fc2,def:def,axis:axis,expand:2}); }
        }
    }

    for(var i=0;i<allFaces.length;i++){
        var f=allFaces[i];
        var def=f.def;
        var hw=def.hw+f.expand, hh=def.hh+f.expand, hd=def.hd+f.expand;
        var corners=getFaceCorners(f.axis,hw,hh,hd);
        var transformed=[];
        for(var j=0;j<corners.length;j++){
            var v=corners[j];
            if(def.swingAngle!==0&&def.pivot){
                var py=def.pivot.y;
                v=vec3(v.x,v.y-py,v.z);
                v=rotX(v,def.swingAngle);
                v=vec3(v.x,v.y+py,v.z);
            }
            v=vec3(v.x+def.tx, v.y+def.ty-36, v.z+def.tz);
            v=rotX(v,RX); v=rotY(v,RY);
            v=scaleV(v,SCALE);
            transformed.push(v);
        }
        var pts2d=[];
        for(var j=0;j<transformed.length;j++){ pts2d.push(project(transformed[j])); }
        f.pts2d=pts2d;
f.depth=(transformed[0].z+transformed[1].z+transformed[2].z+transformed[3].z)/4;
// bias so legs draw behind body and arms
if(def.key==='leftLeg'||def.key==='rightLeg'||
   def.key==='leftLeg2'||def.key==='rightLeg2'){
    f.depth -= 50;
}
        f.shade=getShade(transformed);
    }

    allFaces.sort(function(a,b){ return (a.depth||0)-(b.depth||0); });

    for(var i=0;i<allFaces.length;i++){
        var f=allFaces[i];
        if(!f.pts2d){continue;}
        drawImageQuad(ctx,f.fc,f.pts2d,f.shade);
    }
}

// ============================================================
// PRELOAD
// ============================================================
var skinCanvas=document.getElementById('skin-canvas');

function preloadSkins(onDone){
    var i=0;
    var bar=document.getElementById('loading-bar');
    var lbl=document.getElementById('loading-label');
    function next(){
        if(i>=players.length){onDone();return;}
        var p=players[i];
        lbl.textContent=p.name+' ('+(i+1)+' / '+players.length+')';
        bar.style.width=Math.round((i/players.length)*100)+'%';
        setTimeout(function(){
            if(p.skinBitmap&&p.skinPalette){
                renderSkin(skinCanvas,p);
                p.avatarUrl=skinCanvas.toDataURL();
            }
            i++; next();
        },10);
    }
    next();
}

// ============================================================
// HELPERS
// ============================================================
var scorePlayer=function(p){
    var total=0;
    for(var i=0;i<styles.length;i++){
        var t=p.tiers[styles[i].key]||"LT5";
        var idx=tierOrder.indexOf(t);
        total+=idx===-1?tierOrder.length:idx;
    }
    return total/styles.length;
};

var sortedPlayers=players.slice().sort(function(a,b){return scorePlayer(a)-scorePlayer(b);});

var makeRowSVG = function(rank) {
    var rc = rowColors[Math.min(rank, 3)];
    return {
        bg: '<svg width="100%" height="100%" viewBox="0 0 1000 68" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">' +
            '<rect width="1000" height="68" rx="6" ry="6" fill="' + rc.bg + '" opacity="1"/>' +
            '</svg>',
        poly: '<svg width="100%" height="100%" viewBox="0 0 1000 68" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">' +
            '<polygon points="0,0 155,0 200,68 0,68" fill="' + rc.quad + '" opacity="1"/>' +
            '</svg>'
    };
};

var makeIconHTML=function(style,size){
    if(style.iconUrl){
        return '<img src="'+style.iconUrl+'" width="'+size+'" height="'+size+
               '" style="object-fit:contain;image-rendering:auto;" alt="'+style.label+'">';
    }
    return '<span style="font-size:'+size+'px;line-height:1;">'+style.emoji+'</span>';
};

var makeTierCircle=function(tier,style,circleSize){
    circleSize=circleSize||44;
    var tc=tierColors[tier]||{bg:"#0d0d0d",stroke:"#282828",text:"#4e4e4e",ring:"grey"};
    var ringUrl=RING_URLS[tc.ring];
    var cx=circleSize/2, cy=circleSize/2;
    var rectW=circleSize*0.80, rectH=circleSize*0.30;
    var rectX=(circleSize-rectW)/2;
    var rectY=cy+(circleSize/2-2)*0.50;
    var totalH=rectY+rectH+3;
    var lblSz=circleSize*0.20;
    var iconSz=circleSize*0.5;
    var ringEl='<image href="'+ringUrl+'" x="0" y="0" width="'+circleSize+'" height="'+circleSize+'"/>';
    var iconContent;
    if(style.iconUrl){
        iconContent='<image href="'+style.iconUrl+'" x="'+(cx-iconSz/2)+'" y="'+(cy-iconSz/2)+
                    '" width="'+iconSz+'" height="'+iconSz+'"/>';
    } else {
        iconContent='<foreignObject x="'+(cx-iconSz/2)+'" y="'+(cy-iconSz/2)+
                    '" width="'+iconSz+'" height="'+iconSz+'">' +
                    '<div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;'+
                    'display:flex;align-items:center;justify-content:center;'+
                    'font-size:'+(iconSz*0.78)+'px;line-height:1;">'+
                    style.emoji+'</div></foreignObject>';
    }
    return (
        '<svg width="'+circleSize+'" height="'+totalH+'"'+
        ' viewBox="0 0 '+circleSize+' '+totalH+'"'+
        ' xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml">'+
        ringEl+iconContent+
        '<text x="'+cx+'" y="'+(rectY+rectH*0.74)+'" text-anchor="middle" fill="white"'+
        ' stroke="black" stroke-width="0.5" paint-order="stroke"'+
        ' font-size="'+lblSz+'" font-weight="700" font-family="Jersey 15,Segoe UI,sans-serif">'+tier+'</text>'+
        '</svg>'
    );
};

// ============================================================
// BUILD TABS
// ============================================================
var tabsEl=document.getElementById("tabs");
var addTab=function(label,style,key){
    var tab=document.createElement("div");
    tab.className="tab"+(key==="all"?" active":"");
    tab.title = "PVP Rankings";
    var iconPart=style?'<span class="tab-icon">'+makeIconHTML(style,14)+'</span>':'';
    tab.innerHTML=iconPart+label;
    tab.addEventListener("click",function(){switchTab(key);});
    tabsEl.appendChild(tab);
};

// ============================================================
// BUILD ALL PAGE
// ============================================================
function buildAllPage() {

    var listAll = document.getElementById("list-all");

    for (var i = 0; i < sortedPlayers.length; i++) {

        (function(p, rank) {

            var row = document.createElement("div");
            row.className = "player-row";

var rc = makeRowSVG(rank);

var bgDiv = document.createElement("div");
bgDiv.className = "row-bg";
bgDiv.innerHTML = rc.bg;
row.appendChild(bgDiv);

if (p.bannerUrl) {
    var banner = document.createElement("img");
    banner.src = p.bannerUrl;
    banner.style.cssText =
        'position:absolute;inset:0;width:100%;height:100%;' +
        'object-fit:cover;object-position:center;' +
        'border-radius:6px;opacity:0.4;pointer-events:none;z-index:1;';
    row.appendChild(banner);
}

var polyDiv = document.createElement("div");
polyDiv.className = "row-bg";
polyDiv.innerHTML = rc.poly;
polyDiv.style.zIndex = "2";
row.appendChild(polyDiv);

            // --- Row content (name, position, tiers) ---
            var content = document.createElement("div");
            content.className = "row-content";

            var posEl = document.createElement("div");
            posEl.className = "row-pos";
            posEl.textContent = rank + 1;
            content.appendChild(posEl);

            var nameEl = document.createElement("div");
            nameEl.className = "row-name";
            nameEl.textContent = p.name;
            nameEl.style.position = 'absolute';
            nameEl.style.left = '120px';
            content.appendChild(nameEl);

            var tiersEl = document.createElement("div");
            tiersEl.className = "row-tiers";
            for (var j = 0; j < styles.length; j++) {
                var t = p.tiers[styles[j].key] || "LT5";
                var wrap = document.createElement("div");
                wrap.className = "tier-circle-wrap";
                wrap.innerHTML = makeTierCircle(t, styles[j], 42);
                tiersEl.appendChild(wrap);
            }
            content.appendChild(tiersEl);

            row.appendChild(content);

            // --- Optional avatar image ---
            if (p.avatarUrl) {
                var img = document.createElement("img");
                img.src = p.avatarUrl;
                img.style.cssText =
                    'position:absolute;' +
                    'left:-120px;' +
                    'top:-155px;' +
                    'width:400px;' +
                    'height:400px;' +
                    'z-index:4;' +
                    'pointer-events:none;';
                row.appendChild(img);
            }

            row.addEventListener("click", function() { openDetail(p, rank); });
            listAll.appendChild(row);

        })(sortedPlayers[i], i);
    }
}

function buildNewsPage(){
    var listNews = document.getElementById("list-news");
    var sorted = news.slice().sort(function(a,b){
        return new Date(b.date) - new Date(a.date);
    });

    for(var i=0; i<sorted.length; i++){
        var item = sorted[i];
        var box = document.createElement("div");
        box.className = "news-box";

        if(item.type === "text"){
            box.innerHTML =
                '<div class="news-date">'+item.date+'</div>'+
                '<div class="news-title">'+item.title+'</div>'+
                '<div class="news-body">'+item.body+'</div>';

        } else if(item.type === "tiertest"){
            // find players
            var pA = null, pB = null;
            for(var j=0; j<players.length; j++){
                if(players[j].name === item.playerA.name) pA = players[j];
                if(players[j].name === item.playerB.name) pB = players[j];
            }

            // build styles column
            var stylesHTML = '';
            for(var s=0; s<item.styles.length; s++){
                var styleKey = item.styles[s];
                var styleObj = null;
                for(var k=0; k<styles.length; k++){
                    if(styles[k].key === styleKey){ styleObj = styles[k]; break; }
                }
                if(!styleObj) continue;
                var tierA = pA ? (pA.tiers[styleKey]||'LT5') : 'LT5';
                var tierB = pB ? (pB.tiers[styleKey]||'LT5') : 'LT5';
stylesHTML +=
    '<div class="tiertest-style-row" style="display:flex;flex-direction:column;align-items:center;justify-content:space-between;height:100%;gap:0;">'+
        '<div class="tiertest-result '+item.playerA.results[s]+'" style="position:static;flex:1;display:flex;align-items:center;justify-content:center;">'+item.playerA.results[s]+'</div>'+
        '<img src="'+styleObj.iconUrl+'" width="28" height="28" style="object-fit:contain;">'+
        '<div class="tiertest-result '+item.playerB.results[s]+'" style="position:static;flex:1;display:flex;align-items:center;justify-content:center;">'+item.playerB.results[s]+'</div>'+
    '</div>';
            }

            // build player img HTML
            var imgA = pA && pA.avatarUrl ?
                '<img src="'+pA.avatarUrl+'">' : '';
            var imgB = pB && pB.avatarUrl ?
                '<img src="'+pB.avatarUrl+'">' : '';

box.innerHTML =
    '<div class="news-date">'+item.date+'</div>'+
    '<div class="news-title" style="margin-bottom:12px;">'+item.title+'</div>'+
    '<div class="tiertest-main">'+
        '<div class="tiertest-players">'+
            '<div class="tiertest-player">'+
                '<div class="tiertest-player-name">'+item.playerA.name+'</div>'+
                '<div class="tiertest-player-img">'+imgA+'</div>'+
            '</div>'+
            '<div class="tiertest-player">'+
                '<div class="tiertest-player-name">'+item.playerB.name+'</div>'+
                '<div class="tiertest-player-img">'+imgB+'</div>'+
            '</div>'+
        '</div>'+
        '<div class="tiertest-styles" style="flex-direction:row;display:flex;gap:16px;align-items:center;">'+
            stylesHTML+
        '</div>'+
    '</div>'+
    '<div class="tiertest-writeup">'+item.writeup+'</div>';
        }

        listNews.appendChild(box);
    }
}

// ============================================================
// BUILD STYLE PAGES
// ============================================================
function buildStylePages(){
    var pagesStylesEl=document.getElementById("pages-styles");
    for(var si=0;si<styles.length;si++){
        (function(style){
            var page=document.createElement("div");
            page.className="style-page";
            page.id="page-"+style.key;

            var inner=document.createElement("div");
            inner.className="col-page-inner";

            var byTier={};
            for(var ti=0;ti<tierOrder.length;ti++){byTier[tierOrder[ti]]=[];}
            for(var pi=0;pi<sortedPlayers.length;pi++){
                var t=sortedPlayers[pi].tiers[style.key]||"LT5";
                if(!byTier[t]){byTier[t]=[];}
                byTier[t].push({player:sortedPlayers[pi],rank:pi});
            }

            for(var ti=0;ti<tierOrder.length;ti++){
                (function(tier,entries){
                    var tc=tierColors[tier]||{bg:"#0d0d0d",stroke:"#282828",text:"#4e4e4e"};
                    var col=document.createElement("div");
                    col.className="tier-col";

                    var titleEl=document.createElement("div");
                    titleEl.className="tier-col-title";
                    titleEl.style.cssText="background:"+tc.bg+";color:#fff;"+
                        "border:1px solid "+tc.stroke+";border-bottom:none;";
                    titleEl.textContent=tier;
                    col.appendChild(titleEl);

                    var colPlayers=document.createElement("div");
                    colPlayers.className="tier-col-players";
                    colPlayers.style.cssText="background:"+tc.bg+";border:1px solid "+tc.stroke+
                        ";border-top:none;border-radius:0 0 5px 5px;";

                    for(var ei=0;ei<entries.length;ei++){
                        (function(entry){
                            var card=document.createElement("div");
                            card.className="col-player-card";
                            card.style.overflow="visible";

                            var cbg=document.createElement("div");
                            cbg.className="col-card-bg";
                            cbg.innerHTML = makeRowSVG(entry.rank).bg + makeRowSVG(entry.rank).poly;
                            card.appendChild(cbg);

                            var cc=document.createElement("div");
                            cc.className="col-card-content";

                            var rankEl=document.createElement("div");
                            rankEl.className="col-rank";
                            rankEl.textContent="#"+(entry.rank+1);
                            cc.appendChild(rankEl);

                            var nameEl=document.createElement("div");
                            nameEl.className="col-name";
                            nameEl.textContent=entry.player.name;
                            nameEl.style.position='absolute';
                            nameEl.style.left='55px';
                            cc.appendChild(nameEl);

                            card.appendChild(cc);

                            if(entry.player.avatarUrl){
                                var img=document.createElement("img");
                                img.src=entry.player.avatarUrl;
                                img.style.cssText=
                                    'position:absolute;'+
                                    'left:-40px;'+
                                    'top:-52px;'+
                                    'width:160px;'+
                                    'height:160px;'+
                                    'z-index:4;'+
                                    'pointer-events:none;';
                                card.appendChild(img);
                            }

                            card.addEventListener("click",function(){openDetail(entry.player,entry.rank);});
                            colPlayers.appendChild(card);
                        })(entries[ei]);
                    }

                    col.appendChild(colPlayers);
                    inner.appendChild(col);
                })(tierOrder[ti],byTier[tierOrder[ti]]);
            }

            page.appendChild(inner);
            pagesStylesEl.appendChild(page);
        })(styles[si]);
    }
}

// ============================================================
// TAB SWITCHING
// ============================================================
var switchTab=function(key){
    document.getElementById("page-all").style.display=key==="all"?"flex":"none";
    document.getElementById("page-news").style.display=key==="news"?"flex":"none";
    var sPages=document.querySelectorAll(".style-page");
    for(var i=0;i<sPages.length;i++){sPages[i].classList.remove("open");}
    if(key!=="all"){ var pg=document.getElementById("page-"+key); if(pg){pg.classList.add("open");} }
    var tabs=document.querySelectorAll(".tab");
    var allKeys=["all","news"].concat(styles.map(function(s){return s.key;}));
    for(var i=0;i<tabs.length;i++){
        tabs[i].classList.remove("active");
        if(allKeys[i]===key){tabs[i].classList.add("active");}
    }
};

// ============================================================
// DETAIL
// ============================================================
var openDetail=function(player,rank){
    document.getElementById("detail-name").textContent=player.name;
    document.getElementById("detail-pos").textContent="Global Rank #"+(rank+1);

    var rc=rowColors[Math.min(rank,3)];
    var dq=document.getElementById("detail-quad");
    dq.setAttribute("fill",rc.quad);
    dq.setAttribute("opacity","0.9");

    var detailLeft=document.getElementById("detail-left");
    var oldImg=detailLeft.querySelector("img");
    if(oldImg){detailLeft.removeChild(oldImg);}
    if(player.avatarUrl){
        var img=document.createElement("img");
        img.src = player.avatarUrl;
        img.style.cssText=
            'position:absolute;'+
            'left:-360px;'+
            'top:-240px;'+
            'width:900px;'+
            'height:900px;'+
            'z-index:3;'+
            'pointer-events:none;';
        detailLeft.appendChild(img);
    }

    var tiersEl=document.getElementById("detail-tiers");
    tiersEl.innerHTML="";
    for(var i=0;i<styles.length;i++){
        var t=player.tiers[styles[i].key]||"LT5";
        var item=document.createElement("div");
        item.className="detail-tier-item";
        item.innerHTML=makeTierCircle(t,styles[i],52)+
            '<div class="detail-style-lbl">'+styles[i].label+'</div>';
        tiersEl.appendChild(item);
    }

    document.getElementById("scene-player").classList.add("open");
};

var closeDetail=function(){
    document.getElementById("scene-player").classList.remove("open");
};

document.getElementById("scene-player").addEventListener("click",function(e){
    if(e.target===this){closeDetail();}
});

// ============================================================
// INIT
// ============================================================
preloadSkins(function(){
    document.getElementById("loading-screen").classList.add("hidden");
    addTab("All",null,"all");
    addTab("News", null, "news");
    for(var si=0;si<styles.length;si++){ addTab(styles[si].label,styles[si],styles[si].key); }
    buildAllPage();
    buildStylePages();
    buildNewsPage();
    switchTab("all");
});

</script>
